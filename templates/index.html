<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Automation - DVRPC</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/3/3c/Transparent_square.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            font-weight: bold;
            color: navy;
            font-size: 24px;
        }
        .title {
            font-weight: bold;
            color: green;
            font-size: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        input[type="text"],
        input[type="email"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul.flashes {
            list-style-type: none;
            padding: 0;
        }
        ul.flashes li {
            color: red;
        }
        .log-link {
            margin-top: 15px;
            text-align: right;
        }
        .log-link a {
            color: #007bff;
            text-decoration: none;
        }
        .log-link a:hover {
            text-decoration: underline;
        }
        #spinner {
            display: none;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 15px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .title {
                text-align: left;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="logo">DVRPC</span>
            <span class="title">Travel Monitoring Email Automation</span>
        </div>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form method="post" enctype="multipart/form-data" onsubmit="showSpinner()">
            <div id="spinner">
                <img src="https://i.gifer.com/ZZ5H.gif" alt="Sending..." width="50">
                <p>Processing… Please wait.</p>
            </div>

            <label for="email">Your DVRPC Email (for township replies):</label>
            <input type="email" id="email" name="email" placeholder="your.name@dvrpc.org" required>

            <label for="record_excel">Upload Record IDs Excel File:</label>
            <input type="file" id="record_excel" name="record_excel" accept=".xls,.xlsx" required>

            <button type="submit">Send Emails</button>
        </form>
        <div class="log-link">
            <p><strong>Download Log:</strong> <a href="{{ url_for('download_log') }}">Click here</a></p>
        </div>
    </div>
    <script>
        // Hide spinner on page load
        window.addEventListener('load', function() {
          const spinner = document.getElementById('spinner');
          if (spinner) spinner.style.display = 'none';
        });
        // Show spinner when form is submitted
        function showSpinner() {
          document.getElementById('spinner').style.display = 'block';
        }
    </script>
</body>
</html>
